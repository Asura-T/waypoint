<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waypoint viewer</title>
<!-- Waypoint view-only map. Generated by Waypoint; everything (plans, rooms, 3D engine) is inside this one file. -->
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212a;--line:#2a2f3a;--text:#e6e8ec;--muted:#8b93a3;--accent:#4f8cff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  button,input{font:inherit;color:inherit}
  button{background:#222733;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:#3b4252}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  header h1{font-size:16px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:11px;background:#223;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:2px 8px;white-space:nowrap}
  .seg{display:flex}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0;border-left:0}
  aside{position:fixed;top:52px;left:0;bottom:0;width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:4}
  main{position:fixed;top:52px;left:270px;right:0;bottom:0}
  #three,#cv{position:absolute;inset:0;width:100%;height:100%}
  #cv{display:none;touch-action:none}
  .sec{padding:12px 14px;border-bottom:1px solid var(--line)}
  .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
  .sec h2 span button{padding:2px 7px;font-size:11px}
  .fl{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px}
  .fl:hover{background:var(--panel2)}
  .fl label{flex:1;display:flex;gap:8px;align-items:center;cursor:pointer}
  .fl button{padding:2px 8px;font-size:12px}
  .fl.cur{outline:1px solid var(--accent)}
  .ctl{display:grid;gap:8px}
  .ctl label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  #q{width:100%;background:#11141a;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  #results{flex:1;overflow:auto;padding:4px 8px}
  .res{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:7px;cursor:pointer}
  .res:hover{background:var(--panel2)}
  .res i{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
  .res .m{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
  #tip{position:fixed;pointer-events:none;background:rgba(23,26,33,.96);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:6;display:none;max-width:280px}
  #tip .m{color:var(--muted);font-size:12px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:2px}
  #hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(23,26,33,.92);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--muted);pointer-events:none;white-space:nowrap}
  @media (max-width:760px){aside{top:auto;height:42%;width:auto;right:0;border-right:0;border-top:1px solid var(--line)}main{left:0;bottom:42%}#hint{display:none}}
</style>
</head>
<body>
<header>
  <h1 id="title">Waypoint</h1><span class="badge">View only</span>
  <span style="flex:1"></span>
  <div class="seg"><button id="v3d" class="on">3D</button><button id="v2d">2D floor</button></div>
</header>
<aside>
  <div class="sec">
    <h2>Floors <span><button id="fAll">All</button> <button id="fNone">None</button></span></h2>
    <div id="floors"></div>
  </div>
  <div class="sec ctl" id="ctl3d">
    <label>Floor spacing <input id="explode" type="range" min="1" max="4" step="0.05" value="1.8"></label>
    <label>Show floor plans <input id="showPlan" type="checkbox" checked></label>
    <label>Show labels <input id="showLabels" type="checkbox" checked></label>
  </div>
  <div class="sec" style="padding-bottom:6px"><input id="q" placeholder="Find a room by number or name…" autocomplete="off"></div>
  <div id="results"></div>
  <div class="sec legend" id="legend" style="border-top:1px solid var(--line);border-bottom:0"></div>
</aside>
<main><div id="three"></div><canvas id="cv"></canvas><div id="hint"></div></main>
<div id="tip"></div>

<script type="application/json" id="map-data">__WAYPOINT_DATA__</script>
<script type="text/plain" id="src-three">__THREE_SRC__</script>
<script type="text/plain" id="src-orbit">__ORBIT_SRC__</script>
<script type="module">
// ---------- data and engine (all embedded, works offline from a file) ----------
const D = JSON.parse(document.getElementById('map-data').textContent);
const blobUrl = (src) => URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
const threeUrl = blobUrl(document.getElementById('src-three').textContent);
const T = await import(threeUrl);
const {OrbitControls} = await import(blobUrl(document.getElementById('src-orbit').textContent.replace(/from\s+'three'/g, `from '${threeUrl}'`)));

const $ = id => document.getElementById(id);
const TYPES = {
  room:{label:'Room', color:'#4f8cff', glyph:''}, bathroom:{label:'Bathroom', color:'#38bdf8', glyph:'WC'},
  walkway:{label:'Walkway', color:'#2ec4b6', glyph:'⇄'}, garden:{label:'Garden', color:'#5cb85c', glyph:'✿'},
  balcony:{label:'Balcony', color:'#e0a458', glyph:'⌓'}, stair:{label:'Stair', color:'#ff7a45', glyph:'▤'},
  elevator:{label:'Elevator', color:'#a06bff', glyph:'⇅'}, empty:{label:'Empty', color:'#8b93a3', glyph:'↓'},
};
const OPEN = new Set(['walkway','garden','balcony']);
const typeOf = r => TYPES[r.type] ? r.type : 'room';
const floors = D.floors.slice().sort((a,b) => a.elev - b.elev);
const rooms = D.rooms, walls = D.walls || [];
const fIndex = id => floors.findIndex(f => f.id === id);
const cornersOf = r => r.pts || [[r.x0,r.y0],[r.x1,r.y0],[r.x1,r.y1],[r.x0,r.y1]];
const area = r => r.pts ? Math.abs(r.pts.reduce((a,[x,y],i) => { const [u,v] = r.pts[(i+1)%r.pts.length]; return a + x*v - u*y; }, 0))/2 : (r.x1-r.x0)*(r.y1-r.y0);
const title = r => [r.no, r.name].filter(Boolean).join(' · ') || TYPES[typeOf(r)].label;
const rgba = (hex,a) => `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('title').textContent = D.name; document.title = D.name + ' · Waypoint viewer';
$('legend').innerHTML = Object.values(TYPES).map(t => `<span><i style="background:${t.color}"></i>${t.label}</span>`).join('') + '<span><i style="background:#d9dee7"></i>Wall</span>';

const shown = new Set(floors.map(f => f.id));   // floors visible in 3D
let cur = 0, mode = '3d';

// ---------- side panel ----------
function renderFloors(){
  $('floors').innerHTML = '';
  [...floors].reverse().forEach(f => {
    const i = fIndex(f.id), d = document.createElement('div');
    d.className = 'fl' + (mode === '2d' && i === cur ? ' cur' : '');
    d.innerHTML = `<label><input type="checkbox"> <span></span></label><button title="Open this floor in 2D">2D</button>`;
    const cb = d.querySelector('input'); cb.checked = shown.has(f.id);
    d.querySelector('span').textContent = `${f.name} · ${rooms.filter(r => r.floor === f.id).length}`;
    cb.onchange = () => { cb.checked ? shown.add(f.id) : shown.delete(f.id); layout(); };
    d.querySelector('button').onclick = () => { cur = i; setMode('2d'); };
    $('floors').appendChild(d);
  });
}
$('fAll').onclick = () => { floors.forEach(f => shown.add(f.id)); renderFloors(); layout(); };
$('fNone').onclick = () => { shown.clear(); renderFloors(); layout(); };
function renderResults(){
  const q = $('q').value.trim().toLowerCase();
  const list = q ? rooms.filter(r => `${r.no} ${r.name} ${TYPES[typeOf(r)].label}`.toLowerCase().includes(q)).slice(0, 200) : [];
  $('results').innerHTML = q && !list.length ? '<div style="color:var(--muted);padding:8px">No match.</div>' : '';
  for (const r of list) {
    const d = document.createElement('div'); d.className = 'res';
    d.innerHTML = `<i style="background:${TYPES[typeOf(r)].color}"></i><span></span><span class="m"></span>`;
    d.children[1].textContent = title(r); d.children[2].textContent = floors[fIndex(r.floor)]?.name || '';
    d.onclick = () => focusRoom(r);
    $('results').appendChild(d);
  }
}
$('q').oninput = renderResults;

// ---------- 3D ----------
const el = $('three');
const renderer = new T.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); el.appendChild(renderer.domElement);
const scene = new T.Scene(); scene.background = new T.Color('#0f1115');
const camera = new T.PerspectiveCamera(45, 1, 0.5, 5000);
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
scene.add(new T.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new T.DirectionalLight(0xffffff, 1.1); sun.position.set(-80,150,60); scene.add(sun);
const xs = floors.flatMap(f => [f.extent[0], f.extent[2]]), ys = floors.flatMap(f => [f.extent[1], f.extent[3]]);
const CX = (Math.min(...xs)+Math.max(...xs))/2, CZ = (Math.min(...ys)+Math.max(...ys))/2;
const SPAN = Math.max(20, Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
const gs = Math.ceil(SPAN*2/10)*10; scene.add(new T.GridHelper(gs, gs/10, 0x2a2f3a, 0x1c2028));
const OPAC = {room:.45, bathroom:.5, walkway:.32, garden:.5, balcony:.22, stair:.55, elevator:.55, empty:.07, wall:.92};
const H = 2.8, groups = [], meshes = [], loader = new T.TextureLoader();
floors.forEach((f, fi) => {
  const g = new T.Group(), [x0,y0,x1,y1] = f.extent;
  const mat = new T.MeshBasicMaterial({color:0xffffff, transparent:true, side:T.DoubleSide, depthWrite:false});
  if (D.plans[f.id]) { const tex = loader.load(D.plans[f.id]); tex.colorSpace = T.SRGBColorSpace; tex.anisotropy = 8; mat.map = tex; }
  const holes = rooms.filter(r => r.floor === f.id && typeOf(r) === 'empty');
  if (holes.length) {
    const c = document.createElement('canvas'); c.width = 1024; c.height = Math.max(1, Math.round(1024*(y1-y0)/(x1-x0)));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.fillStyle = '#000';
    for (const r of holes) { x.beginPath(); cornersOf(r).forEach(([px,py],i) => x[i?'lineTo':'moveTo']((px-x0)/(x1-x0)*c.width, (py-y0)/(y1-y0)*c.height)); x.fill(); }
    mat.alphaMap = new T.CanvasTexture(c); mat.alphaTest = 0.02;
  }
  const plane = new T.Mesh(new T.PlaneGeometry(x1-x0, y1-y0), mat);
  plane.rotation.x = -Math.PI/2; plane.position.set((x0+x1)/2-CX, 0.02, (y0+y1)/2-CZ); plane.renderOrder = -1;
  g.add(plane); g.userData = {plane, boxes:new T.Group(), labels:new T.Group()}; g.add(g.userData.boxes, g.userData.labels);
  scene.add(g); groups.push(g);
});
function sprite(r){
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 44, t = typeOf(r);
  const t1 = t === 'room' ? (r.no || r.name || 'Room') : `${TYPES[t].glyph} ${r.no || r.name || TYPES[t].label}`.trim(), t2 = r.no && r.name ? r.name : '';
  x.font = `700 ${fs}px system-ui`; let w = x.measureText(t1).width; x.font = `400 ${fs*.7}px system-ui`; w = Math.max(w, x.measureText(t2).width);
  c.width = Math.ceil(w + 24); c.height = t2 ? fs*2.1 : fs*1.3;
  x.fillStyle = 'rgba(15,17,21,.82)'; x.beginPath(); x.roundRect(0,0,c.width,c.height,12); x.fill();
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.font = `700 ${fs}px system-ui`; x.fillText(t1, c.width/2, t2 ? fs*.65 : c.height/2);
  if (t2) { x.font = `400 ${fs*.7}px system-ui`; x.fillStyle = '#c9d1e0'; x.fillText(t2, c.width/2, fs*1.5); }
  const tex = new T.CanvasTexture(c); tex.colorSpace = T.SRGBColorSpace;
  const sp = new T.Sprite(new T.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  const k = 0.035*SPAN/130; sp.scale.set(c.width*k, c.height*k, 1); sp.renderOrder = 5; return sp;
}
for (const r of rooms) {
  const fi = fIndex(r.floor); if (fi < 0) continue;
  const t = typeOf(r), cx = (r.x0+r.x1)/2, cz = (r.y0+r.y1)/2;
  let geo;
  if (r.pts) { geo = new T.ExtrudeGeometry(new T.Shape(r.pts.map(([x,y]) => new T.Vector2(x-cx, y-cz))), {depth:1, bevelEnabled:false}); geo.rotateX(Math.PI/2); geo.translate(0,1,0); }
  else { geo = new T.BoxGeometry(r.x1-r.x0, 1, r.y1-r.y0); geo.translate(0,.5,0); }
  const col = new T.Color(TYPES[t].color);
  const m = new T.Mesh(geo, new T.MeshStandardMaterial({color:col, transparent:true, opacity:OPAC[t], depthWrite:false, side: t === 'empty' ? T.DoubleSide : T.FrontSide}));
  m.add(new T.LineSegments(new T.EdgesGeometry(geo), new T.LineBasicMaterial({color: t === 'empty' ? 0x8b93a3 : col, transparent:true})));
  m.position.set(cx-CX, 0, cz-CZ); m.userData = {r, fi, t}; groups[fi].userData.boxes.add(m); meshes.push(m);
  if (t !== 'walkway' || r.no || r.name) { const sp = sprite(r); sp.position.set(cx-CX, 0, cz-CZ); sp.userData.t = t; groups[fi].userData.labels.add(sp); }
}
for (const w of walls) {
  const fi = fIndex(w.floor); if (fi < 0) continue;
  const dx = w.x1-w.x0, dy = w.y1-w.y0, L = Math.hypot(dx,dy); if (L < .01) continue;
  const geo = new T.BoxGeometry(L + w.t, 1, w.t); geo.translate(0,.5,0);
  const m = new T.Mesh(geo, new T.MeshStandardMaterial({color:0xd9dee7, transparent:true, opacity:OPAC.wall, roughness:.9}));
  m.position.set((w.x0+w.x1)/2-CX, 0, (w.y0+w.y1)/2-CZ); m.rotation.y = -Math.atan2(dy, dx); m.userData = {r:w, fi, t:'wall'};
  groups[fi].userData.boxes.add(m); meshes.push(m);
}
function layout(){
  const ex = +$('explode').value, vis = floors.map(f => shown.has(f.id)), visCount = vis.filter(Boolean).length;
  groups.forEach((g, i) => {
    g.visible = vis[i]; g.position.y = floors[i].elev * ex;
    const next = floors.slice(i+1).find(f => shown.has(f.id));
    g.userData.plane.material.opacity = $('showPlan').checked ? .9 : 0;
    g.userData.boxes.children.forEach(m => {
      const t = m.userData.t; let h = H, y = 0;
      if (t === 'walkway' || t === 'garden') h = .15; else if (t === 'balcony') h = 1.1;
      else if ((t === 'stair' || t === 'elevator') && next && fIndex(next.id) === i+1) h = (next.elev - floors[i].elev) * ex;
      else if (t === 'empty') { const below = floors[i-1]; h = below ? (floors[i].elev - below.elev) * ex : .01; y = -h; }
      m.scale.y = h; m.position.y = y; m.material.opacity = OPAC[t];
    });
    g.userData.labels.visible = $('showLabels').checked && visCount <= 2;   // labels when one or two floors are shown
    g.userData.labels.children.forEach(s => s.position.y = (OPEN.has(s.userData.t) || s.userData.t === 'empty' ? .15 : H) + 1.5);
  });
  hint();
}
for (const id of ['explode','showPlan','showLabels']) $(id).addEventListener('input', layout);
let fly = null;
function flyTo(target, dist){ const dir = camera.position.clone().sub(controls.target).normalize();
  fly = {t:0, a:controls.target.clone(), b:target, pa:camera.position.clone(), pb:target.clone().add(dir.multiplyScalar(dist))}; }
const midY = () => (floors[0].elev + floors[floors.length-1].elev)/2 * +$('explode').value;
controls.target.set(0, midY(), 0); camera.position.set(-SPAN*1.1, midY() + SPAN*1.25, SPAN*1.5);
const tip = $('tip');
function showTip(e, r, kind, fi){
  if (!r) { tip.style.display = 'none'; return; }
  const f = floors[fi];
  tip.innerHTML = kind === 'wall' ? `<b>Wall</b><div class="m">${esc(f.name)} · ${Math.hypot(r.x1-r.x0, r.y1-r.y0).toFixed(1)} m long</div>`
    : `<b>${esc(title(r))}</b><div class="m">${esc(f.name)} · ${TYPES[typeOf(r)].label} · ${area(r).toFixed(1)} m²</div>`;
  tip.style.display = 'block'; tip.style.left = Math.min(e.clientX+14, innerWidth-290)+'px'; tip.style.top = (e.clientY+14)+'px';
}
function pick3d(e){
  const rc = el.getBoundingClientRect(), ray = new T.Raycaster();
  ray.setFromCamera(new T.Vector2((e.clientX-rc.left)/rc.width*2-1, -(e.clientY-rc.top)/rc.height*2+1), camera);
  return ray.intersectObjects(meshes.filter(m => groups[m.userData.fi].visible), false)[0]?.object;
}
let hover = null, down = null;
renderer.domElement.addEventListener('pointermove', e => {
  const m = pick3d(e); if (hover && hover !== m) hover.material.opacity = OPAC[hover.userData.t];
  hover = m; if (m) m.material.opacity = .85; showTip(e, m?.userData.r, m?.userData.t, m?.userData.fi);
});
renderer.domElement.addEventListener('pointerleave', () => tip.style.display = 'none');
renderer.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX-down[0], e.clientY-down[1]) < 4) { const m = pick3d(e); if (m) zoom3d(m); } });
function zoom3d(m){ const b = new T.Box3().setFromObject(m); flyTo(b.getCenter(new T.Vector3()), Math.max(30, b.getSize(new T.Vector3()).length()*2.5)); }
function resize3d(){ const w = el.clientWidth, h = el.clientHeight; if (!w) return; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
(function loop(){ requestAnimationFrame(loop); if (mode !== '3d') return;
  if (fly) { fly.t = Math.min(1, fly.t+.04); const k = 1-Math.pow(1-fly.t,3); controls.target.lerpVectors(fly.a, fly.b, k); camera.position.lerpVectors(fly.pa, fly.pb, k); if (fly.t >= 1) fly = null; }
  controls.update(); renderer.render(scene, camera); })();

// ---------- 2D floor ----------
const cv = $('cv'), ctx = cv.getContext('2d'), imgs = {};
let view = {s:6, ox:0, oy:0}, pan = null;
const toScr = (x,y) => [x*view.s + view.ox, y*view.s + view.oy], toW = (sx,sy) => [(sx-view.ox)/view.s, (sy-view.oy)/view.s];
function img(f){ if (!D.plans[f.id]) return null; if (!imgs[f.id]) { const im = new Image(); im.onload = draw2d; im.src = D.plans[f.id]; imgs[f.id] = im; } return imgs[f.id]; }
function resize2d(){ const d = devicePixelRatio || 1; cv.width = Math.round(cv.clientWidth*d); cv.height = Math.round(cv.clientHeight*d); ctx.setTransform(d,0,0,d,0,0); draw2d(); }
function fit2d(){ const [x0,y0,x1,y1] = floors[cur].extent, W = cv.clientWidth, Hh = cv.clientHeight;
  view.s = Math.min(W/(x1-x0), Hh/(y1-y0))*.96; view.ox = (W-(x1-x0)*view.s)/2 - x0*view.s; view.oy = (Hh-(y1-y0)*view.s)/2 - y0*view.s; draw2d(); }
const path = r => { ctx.beginPath(); cornersOf(r).forEach(([x,y],i) => { const [p,q] = toScr(x,y); i ? ctx.lineTo(p,q) : ctx.moveTo(p,q); }); ctx.closePath(); };
let hl = null;   // highlighted room (from search)
function draw2d(){
  if (mode !== '2d') return;
  const f = floors[cur], W = cv.clientWidth, Hh = cv.clientHeight;
  ctx.fillStyle = '#0f1115'; ctx.fillRect(0,0,W,Hh);
  const [x0,y0,x1,y1] = f.extent, [a,b] = toScr(x0,y0), im = img(f);
  ctx.fillStyle = '#fff'; ctx.fillRect(a, b, (x1-x0)*view.s, (y1-y0)*view.s);
  if (im && im.complete && im.naturalWidth) ctx.drawImage(im, a, b, (x1-x0)*view.s, (y1-y0)*view.s);
  const list = rooms.filter(r => r.floor === f.id);
  for (const r of list) {
    const t = typeOf(r), c = TYPES[t].color;
    path(r); ctx.fillStyle = rgba(c, t === 'empty' ? .35 : OPEN.has(t) ? .22 : .18); ctx.fill();
    if (t === 'empty') ctx.setLineDash([7,5]); else if (t === 'balcony') ctx.setLineDash([6,3]);
    ctx.lineWidth = 1.6; ctx.strokeStyle = t === 'empty' ? '#5b6375' : c; ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.lineCap = 'square'; ctx.strokeStyle = '#273244';
  for (const w of walls.filter(w => w.floor === f.id)) { const [p,q] = toScr(w.x0,w.y0), [u,v] = toScr(w.x1,w.y1);
    ctx.beginPath(); ctx.moveTo(p,q); ctx.lineTo(u,v); ctx.lineWidth = Math.max(2, w.t*view.s); ctx.stroke(); }
  ctx.lineCap = 'butt';
  for (const r of list) {                                // labels
    const [p,q] = toScr(r.x0,r.y0), w = (r.x1-r.x0)*view.s, h = (r.y1-r.y0)*view.s, t = typeOf(r);
    if (w < 26 || h < 14) continue;
    const fs = Math.max(9, Math.min(20, Math.min(w/5, h/3))), head = t === 'room' ? (r.no || r.name) : `${TYPES[t].glyph} ${r.no || r.name || TYPES[t].label}`.trim();
    if (!head) continue;
    ctx.save(); ctx.beginPath(); ctx.rect(p,q,w,h); ctx.clip(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const lines = [[head, `700 ${fs}px system-ui`]]; if (r.no && r.name && h > fs*2.4) lines.push([r.name, `400 ${fs*.72}px system-ui`]);
    const lh = fs*1.1, top = q + h/2 - (lines.length-1)*lh/2;
    lines.forEach(([txt, font], k) => { ctx.font = font; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.strokeText(txt, p+w/2, top+k*lh, w-6); ctx.fillStyle = '#0e1a33'; ctx.fillText(txt, p+w/2, top+k*lh, w-6); });
    ctx.restore();
  }
  if (hl && hl.floor === f.id) { path(hl); ctx.lineWidth = 3; ctx.strokeStyle = '#ffd23f'; ctx.stroke(); }
}
function inside(r, x, y){
  if (!(x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1)) return false; if (!r.pts) return true;
  let c = false; for (let i = 0, j = r.pts.length-1; i < r.pts.length; j = i++) { const [xi,yi] = r.pts[i], [xj,yj] = r.pts[j]; if ((yi > y) !== (yj > y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) c = !c; } return c;
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pan = {sx:e.offsetX, sy:e.offsetY, ox:view.ox, oy:view.oy}; });
cv.addEventListener('pointermove', e => {
  if (pan) { view.ox = pan.ox + e.offsetX - pan.sx; view.oy = pan.oy + e.offsetY - pan.sy; draw2d(); return; }
  const [x,y] = toW(e.offsetX, e.offsetY), f = floors[cur];
  const r = rooms.filter(r => r.floor === f.id && inside(r, x, y)).sort((a,b) => area(a) - area(b))[0];
  showTip(e, r, 'room', cur);
});
cv.addEventListener('pointerup', () => pan = null);
cv.addEventListener('pointerleave', () => tip.style.display = 'none');
cv.addEventListener('wheel', e => { e.preventDefault(); const k = Math.exp(-e.deltaY*(e.ctrlKey ? .01 : .0015)), s = Math.min(200, Math.max(2, view.s*k)), f = s/view.s;
  view.ox = e.offsetX - (e.offsetX-view.ox)*f; view.oy = e.offsetY - (e.offsetY-view.oy)*f; view.s = s; draw2d(); }, {passive:false});

// ---------- modes, search focus ----------
function setMode(m){
  mode = m; $('v3d').classList.toggle('on', m === '3d'); $('v2d').classList.toggle('on', m === '2d');
  el.style.display = m === '3d' ? 'block' : 'none'; cv.style.display = m === '2d' ? 'block' : 'none'; $('ctl3d').style.display = m === '3d' ? '' : 'none';
  tip.style.display = 'none'; renderFloors();
  if (m === '3d') { resize3d(); layout(); } else { resize2d(); fit2d(); }
  hint();
}
function focusRoom(r){
  hl = r; const fi = fIndex(r.floor);
  if (mode === '2d') { cur = fi; renderFloors(); const W = cv.clientWidth, Hh = cv.clientHeight;
    view.s = Math.max(view.s, Math.min(W/(r.x1-r.x0), Hh/(r.y1-r.y0))*.35); view.ox = W/2 - (r.x0+r.x1)/2*view.s; view.oy = Hh/2 - (r.y0+r.y1)/2*view.s; draw2d(); }
  else { if (!shown.has(r.floor)) { shown.add(r.floor); renderFloors(); layout(); } const m = meshes.find(m => m.userData.r === r); if (m) zoom3d(m); }
}
function hint(){
  $('hint').textContent = mode === '3d' ? 'Drag to rotate · right-drag to pan · scroll to zoom · tick floors on the left to choose which ones show · labels appear when 1–2 floors are shown'
    : `${floors[cur].name} · drag to move · scroll to zoom · hover a room for details`;
}
$('v3d').onclick = () => setMode('3d'); $('v2d').onclick = () => setMode('2d');
new ResizeObserver(() => { if (mode === '3d') resize3d(); else resize2d(); }).observe(document.querySelector('main'));
renderFloors(); setMode('3d');
</script>
