# Builds the Waypoint image and publishes it to GitHub Container Registry.
#   push to main      -> ghcr.io/asura-t/waypoint:latest + :sha-<commit>
#   push tag v1.2.3   -> :1.2.3 + :1.2 + :sha-<commit>
#   pull request      -> build only (validation), nothing is published
# Deployment to TrueNAS stays manual; see docs/TRUENAS.md.
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the code; package write is granted only to the job below.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/asura-t/waypoint   # GHCR names must be lowercase

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io with GITHUB_TOKEN (unused on pull requests)
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Version string
        id: ver
        shell: bash
        run: |
          short="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME} (${short})" >> "$GITHUB_OUTPUT"
          else
            echo "version=${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Waypoint
            org.opencontainers.image.description=Interactive 3D office map for planning office improvements and documenting network equipment

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WAYPOINT_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Version shown in the app: \`${{ steps.ver.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
