# Waypoint for TrueNAS: Apps → Discover Apps → ⋮ → Install via YAML
#
# Before pasting, replace the two placeholders:
#   <POOL>      your pool name, e.g. tank
#   <IMAGE_TAG> the image tag to run. Prefer a fixed tag such as sha-1a2b3c4 or 1.2.0
#               (from GitHub → Packages → waypoint) so updates and rollbacks are explicit.
#               "latest" also works, but then you must pull it yourself to update.
#
# The data dataset must exist and be owned by 568:568 (the TrueNAS "apps" user).
# Private image? Pull it once in the shell first (docs/TRUENAS.md, "Private image access");
# never put a token in this file.
services:
  waypoint:
    image: ghcr.io/asura-t/waypoint:<IMAGE_TAG>
    pull_policy: missing          # use the local copy if present, otherwise pull
    container_name: waypoint
    restart: unless-stopped
    user: "568:568"
    ports:
      - "8080:8080"               # host:container - change only the left side if 8080 is taken
    environment:
      TZ: "Asia/Phnom_Penh"
      WAYPOINT_SEED_DEMO: "true"  # demo map only when /data is empty on first start
    volumes:
      - /mnt/<POOL>/apps/waypoint/data:/data
